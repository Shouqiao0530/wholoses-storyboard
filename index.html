<style>
:root{

}

    --bg:#14171C; --surface:#1E2229; --surface-2:#252A32; --ink:#E7E9ED; --muted:#9AA3B0; --line:#343A44;
    --accent:#3FB4B0; --accent-ink:#0F1A1A; --accent-soft:#1E3A3A;
    --tab:#9DB2D1; --tab-soft:#283243; --fig:#E0A94C; --fig-soft:#3A2E17;

    color-scheme:dark;

}
:root[data-theme="dark"]{
  --bg:#14171C; --surface:#1E2229; --surface-2:#252A32; --ink:#E7E9ED; --muted:#9AA3B0; --line:#343A44;
  --accent:#3FB4B0; --accent-ink:#0F1A1A; --accent-soft:#1E3A3A;
  --tab:#9DB2D1; --tab-soft:#283243; --fig:#E0A94C; --fig-soft:#3A2E17;
  --moved:#E58B77; --moved-soft:#3E2620; --app:#1A1D23; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;line-height:1.2;white-space:nowrap}
button:hover{background:var(--surface-2)}
button:focus-visible,[contenteditable]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.05)}
button.ghost{border-color:transparent;padding:4px 6px;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
select,input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
textarea{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;resize:vertical}

.top{display:flex;flex-direction:column;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.top .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;font-size:18px;margin:0;letter-spacing:.01em;white-space:nowrap}
.top .sub{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.legend{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}
.chip{display:inline-block;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;line-height:1.3}
.chip.tab{background:var(--tab-soft);color:var(--tab)}
.chip.fig{background:var(--fig-soft);color:var(--fig)}
.chip.moved{background:var(--moved-soft);color:var(--moved);text-transform:none;letter-spacing:0}
.chip.new{background:var(--accent-soft);color:var(--accent);text-transform:none;letter-spacing:0}
.story{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;background:var(--surface-2)}
.story .lab{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-top:3px;white-space:nowrap}
.story .txt{font-size:13.5px;line-height:1.5;max-width:1400px;white-space:pre-line;padding:2px 4px;margin:0 -4px;border-radius:4px}
.banner{display:none;align-items:center;gap:10px;background:var(--moved-soft);color:var(--moved);border-radius:6px;padding:6px 12px;font-size:13px}
body.readonly .banner{display:flex}
body.readonly .story .txt{pointer-events:none}
body.readonly #reset-story{display:none}
.story button{align-self:flex-start;white-space:nowrap}

.board{flex:1;display:flex;gap:14px;padding:14px 16px 18px;overflow-x:auto;overflow-y:hidden;align-items:stretch}
.col{flex:0 0 400px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:0;max-height:100%}
.col.appendix{background:var(--app)}
.col.dragover{outline:2px solid var(--accent);outline-offset:-2px}
.colhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.colhead .row{display:flex;align-items:center;gap:6px}
.colkey{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.count{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:16px;line-height:1.25;padding:2px 4px;margin:0 -4px;border-radius:4px;min-height:1.2em}
.claim{font-size:12.5px;color:var(--muted);line-height:1.4;padding:2px 4px;margin:0 -4px;border-radius:4px;min-height:1.2em}
[contenteditable="true"]:hover{background:var(--surface-2)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.colhead .tools{display:flex;gap:2px;margin-left:auto}
body.readonly .tools{display:none}
.notes{display:none;padding:0 12px 8px}
.col.shownotes .notes{display:block}
.notes textarea{min-height:56px;font-size:12.5px}
.cards{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.cards:empty::after{content:"Drop here";color:var(--muted);font-size:12px;text-align:center;padding:18px 0;border:1px dashed var(--line);border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;box-shadow:var(--shadow);cursor:grab;display:flex;flex-direction:column;gap:6px;position:relative}
.col.appendix .card{box-shadow:none}
.card:active{cursor:grabbing}
body.readonly .card{cursor:default}
.card.dragging{opacity:.45}
.card .zh{font-size:13px;line-height:1.4;font-weight:500}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .label{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);word-break:break-all}
.card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top left;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:zoom-in;display:block}
.card .thumb.tab{aspect-ratio:16/10;object-fit:contain;padding:3px}
.card .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.card .foot select{font-size:11.5px;padding:2px 4px;margin-left:auto;max-width:170px}
body.readonly .card .foot{display:none}
.card .placeholder{aspect-ratio:16/9;border:1px dashed var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.drop-indicator{height:0;border-top:2px solid var(--accent);margin:-5px 0}

.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal[hidden]{display:none}
.dialog{background:var(--surface);color:var(--ink);border-radius:12px;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dialog header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dialog header h2{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:16px;margin:0;font-weight:600}
.dialog .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dialog textarea{min-height:320px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.vrow .vname{font-weight:500}
.vrow .vmeta{color:var(--muted);font-size:12px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.vrow .spacer{flex:1}
.lightbox{position:fixed;inset:0;background:rgba(10,12,16,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px;cursor:zoom-out;overflow:auto}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.lightbox .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:13px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:700px){.col{flex-basis:300px}.top h1{font-size:16px}}
</style>

const OLD_STORIES = ['Front-end (retail) traders on Hyperliquid lose the way gamblers do. Every wallet faces the same order book, the same fee schedule and the same margin engine, yet retail loses $1.11 billion in 15 months, and most of it goes to the venue rather than to the traders on the other side: the venue collects $725 million in fees from retail, more than three times what algorithmic market makers earn. Every leverage cohort\'s equity falls over its life; the smallest, highest-leverage accounts lose everything they started with and deposit again, while market makers and algorithmic takers withdraw. The loss comes from how retail trades, through three channels: fees (65%), forced exits (20%) and voluntary trading (14%). In execution, retail sends large orders when the book is thin, so it pays the same half-spread as everyone else but far more slippage, and not because it is more crowded. In timing, retail opens and cuts losses in the direction the price has just moved, the algorithmic groups take the other side, and the price then reverses; the higher the leverage, the sharper the reversal. In forced exits, liquidations are the costliest way to close and almost all of them are retail; leverage sets how often a wallet is liquidated and cascades set how much each liquidation costs, so the lowest-leverage cohort, liquidated rarely but late in the worst cascades, loses the most on its liquidations. At matched leverage retail is still liquidated 20 times as often as market makers, so this is not only about leverage. Regulators are reaching for leverage caps; the evidence points to cascades and to the venue\'s fee take.'];

 {id:'fig:lev_cascade_progress',kind:'fig',zh:'When each cohort is liquidated inside a large episode: Q4 and Q5 first, Q1 to Q3 late',cur:'A',prop:'A',img:'lev_cascade_progress'},
 {id:'fig:lev_oct10',po:14,kind:'fig',zh:'The October 10 BTC cascade by cohort (moved into 6.5.1 on Sep 30)',cur:'6.5',prop:'6.5',img:'lev_oct10_cascade'},
 {id:'tab:funding',kind:'tab',zh:'Funding under two measures: 120-minute attribution vs held to period end',cur:'A',prop:'A'},
 {id:'tab:funding_exposure',kind:'tab',zh:'Opening flow, net position and gross exposure: front-end traders are net long',cur:'A',prop:'A'},
 {id:'NEW:venue_fees_vs_pnl',po:7,kind:'fig',zh:'New figure: cumulative fees collected by the venue against cumulative front-end P&L',cur:'N',prop:'6.1',isNew:true},
 {id:'NEW:mm_algo_net_deposits',po:6,kind:'fig',zh:'New figure (drawn, T-075 pending): net deposits of market makers and algorithmic takers against front-end wallets',cur:'N',prop:'6.2',isNew:true},
];

const PRESETS = {
 current:{
  columns:[
   {key:'5',title:'5 Empirical Methodology',claim:'Classification, cost decomposition, trade purpose, leverage (unchanged).'},
   {key:'6.1',title:'6.1 Dollar Profits and Losses by Group',claim:'Front-end traders finance the venue.'},
   {key:'6.2',title:'6.2 Leverage: Which Front-End Traders Lose, and Why',claim:'Relative to equity the loss falls hardest on small high-leverage accounts; they keep depositing; they lose on timing, not execution.'},
   {key:'6.3',title:'6.3 Execution Cost',claim:'2.43 bps against 0.70 for market makers; the half-spread is common, the gap is slippage.'},
   {key:'6.4',title:'6.4 Post-Trade Price Impact and Flow Dynamics',claim:'Common at 1 minute, apart by 2 hours; front-end flow is momentum, algorithmic flow contrarian.'},
   {key:'6.5',title:'6.5 Liquidations',claim:'Front-end traders bear 80% of liquidation losses; forced exits are the costliest closes; by cohort, Q1 loses most.'},
   {key:'6.6',title:'6.6 Fee Tiers',claim:'Front-end traders pay 87% of fees; two margins, role and tier.'},
   {key:'A',title:'Appendix',claim:'A.1 rules · A.2 Ambiguous · A.3 fee tiers · A.4 crowd controls · A.5 liquidation statistics · A.6 leverage · A.7 funding'},
   {key:'N',title:'To do / new',claim:'Figures that do not exist yet.'},
  ],
  assign:e=>e.cur,
 },
 proposal:{
  columns:[
   {key:'5',title:'5 Empirical Methodology',claim:'Unchanged.'},
   {key:'6.1',title:'6.1 Who Loses, and to Whom',claim:'Front-end traders lose $1.11B, market makers gain $0.21B, algorithmic takers break even. Two thirds of the loss, $725M, is the fee the venue posts, 3.4 times the combined profit of every market maker; only $380M is lost to other traders. Fees are settled here and never come back: two margins, taker role and base tier.'},
   {key:'6.2',title:'6.2 Which Wallets Lose',claim:'The median front-end wallet loses 94% of its first-day equity, the median market maker 9%. The loss rises with leverage: the two highest cohorts lose more than they started with and fund themselves again, while the algorithmic groups withdraw. Closes on the bridge table: the $380M split across the three moments of a trade, by group and by cohort. Execution cost is flat across cohorts; timing and liquidation are not.'},
   {key:'6.3',title:'6.3 Execution: Large Orders into Thin Books',claim:'Same half-spread as everyone else; the gap is slippage. One sentence each for the size regression and the depth elasticity (tables in the appendix). Fees sit here too: taker role and base tier.'},
   {key:'6.4',title:'6.4 Timing: Momentum Trades Against Contrarian Algorithms',claim:'Common at 1 minute; by 2 hours front-end impact halves while algorithmic impact rises. Openings are where the groups part: front-end flow chases the move, the algorithmic groups take the other side, and the price walks back afterwards.'},
   {key:'6.5',title:'6.5 Forced Exits: Frequent at High Leverage, Ruinous at Low Leverage',claim:'The costliest way to close, 97% front-end outside October 10. Leverage sets how often a wallet is closed out, cascades set how much it costs: high cohorts often and cheaply, Q1 rarely and ruinously, late inside the largest episodes.'},
   {key:'A',title:'Appendix',claim:'Everything already in the appendix stays there, plus the taker-maker pair matrix moved down from 6.1.'},
   {key:'X',title:'Parking',claim:'Undecided during discussion.'},
  ],
  assign:e=>e.prop,
 }
};
const STORE='storyboard.wholoses.v6', VSTORE='storyboard.wholoses.versions';
const exById=Object.fromEntries(EX.map(e=>[e.id,e]));

let state=null, readonly=false, viewState=null;
function fromPreset(name,story){
  const p=PRESETS[name];
  const order={}; p.columns.forEach(c=>order[c.key]=[]);
  const list=EX.map((e,i)=>[e,i]).sort((a,b)=>(name==='proposal'?((a[0].po||1000+a[1])-(b[0].po||1000+b[1])):(a[1]-b[1]))).map(x=>x[0]);
  list.forEach(e=>{ let k=p.assign(e); if(!order[k]) k=p.columns[p.columns.length-1].key; order[k].push(e.id); });
  return {preset:name,story:story==null?STORY_DEFAULT:story,columns:p.columns.map(c=>({key:c.key,title:c.title,claim:c.claim,notes:''})),order};
}
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(STORE); if(s){ const st=JSON.parse(s); if(st&&st.columns&&st.order){ if(st.story==null||OLD_STORIES.includes(st.story)) st.story=STORY_DEFAULT; return st; } } }catch(e){} return null; }
function loadVersions(){ try{ const s=localStorage.getItem(VSTORE); if(s){ const v=JSON.parse(s); if(Array.isArray(v)) return v; } }catch(e){} return []; }
function saveVersions(v){ try{ localStorage.setItem(VSTORE,JSON.stringify(v)); }catch(e){ toast('Could not save: browser storage is full'); } }
function keyLabel(k){ return k==='A'?'appendix':(k==='X'?'parking':(k==='N'?'to do':'§'+k)); }
function shortName(k){ return k==='A'?'Appendix':(k==='X'?'Parking':(k==='N'?'To do':k)); }

const board=document.getElementById('board');
const storyEl=document.getElementById('story');
function render(){
  const st=readonly?viewState:state;
  document.body.classList.toggle('readonly',readonly);
  storyEl.textContent=st.story||'';
  storyEl.contentEditable=readonly?'false':'true';
  board.innerHTML='';
  st.columns.forEach((c,ci)=>{
    const col=document.createElement('section'); col.className='col'+(c.key==='A'?' appendix':'')+(c.notes?' shownotes':''); col.dataset.key=c.key;
    const head=document.createElement('div'); head.className='colhead';
    const row1=document.createElement('div'); row1.className='row';
    const key=document.createElement('span'); key.className='colkey'; key.textContent=keyLabel(c.key);
    const n=(st.order[c.key]||[]).length;
    const count=document.createElement('span'); count.className='count'; count.textContent=n+(n===1?' exhibit':' exhibits');
    const tools=document.createElement('span'); tools.className='tools';
    const mk=(t,title,fn)=>{const b=document.createElement('button');b.className='ghost';b.textContent=t;b.title=title;b.addEventListener('click',fn);return b;};
    tools.appendChild(mk('‹','Move section left',()=>moveCol(ci,-1)));
    tools.appendChild(mk('›','Move section right',()=>moveCol(ci,1)));
    tools.appendChild(mk('✎','Notes for this section',()=>{col.classList.toggle('shownotes');}));
    tools.appendChild(mk('✕','Remove this section (its exhibits go to Parking)',()=>delCol(ci)));
    row1.append(key,count,tools);
    const title=document.createElement('div'); title.className='title'; title.contentEditable=readonly?'false':'true'; title.dataset.ph='Section title'; title.textContent=c.title;
    title.addEventListener('blur',()=>{ if(readonly) return; c.title=title.textContent.trim();save();});
    const claim=document.createElement('div'); claim.className='claim'; claim.contentEditable=readonly?'false':'true'; claim.dataset.ph='One-sentence claim for this section'; claim.textContent=c.claim;
    claim.addEventListener('blur',()=>{ if(readonly) return; c.claim=claim.textContent.trim();save();});
    head.append(row1,title,claim);
    const notes=document.createElement('div'); notes.className='notes';
    const ta=document.createElement('textarea'); ta.placeholder='Notes: how to write it, what stays, what is open'; ta.value=c.notes||''; ta.readOnly=readonly;
    ta.addEventListener('input',()=>{c.notes=ta.value;save();});
    notes.appendChild(ta);
    const cards=document.createElement('div'); cards.className='cards'; cards.dataset.key=c.key;
    (st.order[c.key]||[]).forEach(id=>{ const e=exById[id]; if(e) cards.appendChild(renderCard(e,c.key,st)); });
    if(!readonly) wireDrop(cards,col);
    col.append(head,notes,cards);
    board.appendChild(col);
  });
}
function renderCard(e,colKey,st){
  const d=document.createElement('article'); d.className='card'; d.draggable=!readonly; d.dataset.id=e.id;
  const zh=document.createElement('div'); zh.className='zh'; zh.textContent=e.zh;
  const meta=document.createElement('div'); meta.className='meta';
  const chip=document.createElement('span'); chip.className='chip '+e.kind; chip.textContent=e.kind==='tab'?'Table':'Figure';
  const lab=document.createElement('span'); lab.className='label'; lab.textContent=e.id;
  meta.append(chip,lab);
  if(e.isNew){ const nn=document.createElement('span'); nn.className='chip new'; nn.textContent='new'; meta.appendChild(nn); }
  else if(e.cur!==colKey){ const m=document.createElement('span'); m.className='chip moved'; m.textContent='now '+shortName(e.cur); meta.appendChild(m); }
  d.append(zh,meta);
  const t=e.kind==='fig'?(e.img&&THUMBS[e.img]):TABS[e.id];
  if(t){ const img=document.createElement('img'); img.className='thumb'+(e.kind==='tab'?' tab':''); img.src=t.s; img.alt=e.id; img.loading='lazy';
    img.addEventListener('click',ev=>{ev.stopPropagation();openLightbox(t.l,e.id);}); d.appendChild(img); }
  else { const ph=document.createElement('div'); ph.className='placeholder'; ph.textContent=e.isNew?'not drawn yet':'no preview'; d.appendChild(ph); }
  const foot=document.createElement('div'); foot.className='foot';
  const sel=document.createElement('select'); sel.title='Move to…';
  const o0=document.createElement('option'); o0.textContent='Move to…'; o0.value=''; sel.appendChild(o0);
  st.columns.forEach(c=>{ if(c.key!==colKey){ const o=document.createElement('option'); o.value=c.key; o.textContent=c.title.slice(0,32); sel.appendChild(o);} });
  sel.addEventListener('change',()=>{ if(sel.value){ moveCard(e.id,sel.value,null); } });
  foot.appendChild(sel);
  d.appendChild(foot);
  if(!readonly){
    d.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/plain',e.id); ev.dataTransfer.effectAllowed='move'; d.classList.add('dragging'); });
    d.addEventListener('dragend',()=>{ d.classList.remove('dragging'); clearIndicators(); });
  }
  return d;
}
function clearIndicators(){ document.querySelectorAll('.drop-indicator').forEach(n=>n.remove()); document.querySelectorAll('.col.dragover').forEach(n=>n.classList.remove('dragover')); }
function wireDrop(cards,col){
  cards.addEventListener('dragover',ev=>{ ev.preventDefault(); ev.dataTransfer.dropEffect='move';
    clearIndicators(); col.classList.add('dragover');
    const after=cardAfterPointer(cards,ev.clientY); const ind=document.createElement('div'); ind.className='drop-indicator';
    if(after) cards.insertBefore(ind,after); else cards.appendChild(ind); });
  cards.addEventListener('dragleave',ev=>{ if(!col.contains(ev.relatedTarget)) clearIndicators(); });
  cards.addEventListener('drop',ev=>{ ev.preventDefault(); const id=ev.dataTransfer.getData('text/plain'); const after=cardAfterPointer(cards,ev.clientY); clearIndicators();
    moveCard(id,cards.dataset.key,after?after.dataset.id:null); });
}
function cardAfterPointer(cards,y){
  const els=[...cards.querySelectorAll('.card:not(.dragging)')];
  for(const el of els){ const r=el.getBoundingClientRect(); if(y<r.top+r.height/2) return el; }
  return null;
}
function moveCard(id,toKey,beforeId){
  if(readonly) return;
  for(const k in state.order){ const i=state.order[k].indexOf(id); if(i>=0) state.order[k].splice(i,1); }
  const arr=state.order[toKey]||(state.order[toKey]=[]);
  const j=beforeId?arr.indexOf(beforeId):-1;
  if(j>=0) arr.splice(j,0,id); else arr.push(id);
  save(); render();
}
function moveCol(i,dir){ if(readonly) return; const j=i+dir; if(j<0||j>=state.columns.length) return; const t=state.columns[i]; state.columns[i]=state.columns[j]; state.columns[j]=t; save(); render(); }
function delCol(i){ if(readonly) return; const c=state.columns[i]; if(state.columns.length<=2) return; if(!confirm('Remove "'+c.title+'"? Its exhibits move to Parking.')) return;
  let park=state.columns.find(x=>x.key==='X'); if(!park){ park={key:'X',title:'Parking',claim:'',notes:''}; state.columns.push(park); state.order.X=[]; }
  state.order.X=(state.order.X||[]).concat(state.order[c.key]||[]); delete state.order[c.key]; state.columns.splice(i,1); save(); render(); }
function addCol(){ if(readonly) return; let n=1; while(state.columns.some(c=>c.key==='new'+n)) n++; const key='new'+n; state.columns.splice(Math.max(1,state.columns.length-2),0,{key,title:'New section',claim:'',notes:''}); state.order[key]=[]; save(); render(); }
storyEl.addEventListener('blur',()=>{ if(readonly) return; state.story=storyEl.innerText.trim(); save(); });

// versions
function fmtTime(ts){ const d=new Date(ts); return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function saveVersion(){ if(readonly) return; const v=loadVersions(); const def='v'+(v.length+1); const name=prompt('Name this version',def); if(name===null) return;
  v.unshift({name:(name.trim()||def),ts:Date.now(),state:JSON.parse(JSON.stringify(state))}); saveVersions(v); toast('Saved "'+(name.trim()||def)+'"'); }
function openVersions(){ const v=loadVersions(); mtitle.textContent='Saved versions'; mtext.hidden=true; mlist.hidden=false; mactions.innerHTML=''; mhint.textContent=v.length?'Restore replaces the board with that version. Versions live in this browser only.':'No versions saved yet. Use "Save version" when the board looks right.';
  mlist.innerHTML='';
  v.forEach((ver,i)=>{ const row=document.createElement('div'); row.className='vrow';
    const nm=document.createElement('span'); nm.className='vname'; nm.textContent=ver.name;
    const meta=document.createElement('span'); meta.className='vmeta'; const nCols=ver.state.columns.length; meta.textContent=fmtTime(ver.ts)+' · '+nCols+' sections';
    const sp=document.createElement('span'); sp.className='spacer';
    const view=document.createElement('button'); view.textContent='View'; view.addEventListener('click',()=>{ viewState=JSON.parse(JSON.stringify(ver.state)); readonly=true; document.querySelector('.banner span').textContent='Viewing "'+ver.name+'", read-only.'; modal.hidden=true; render(); });
    const rs=document.createElement('button'); rs.className='primary'; rs.textContent='Restore'; rs.addEventListener('click',()=>{ if(!confirm('Replace the board with "'+ver.name+'"?')) return; state=JSON.parse(JSON.stringify(ver.state)); readonly=false; save(); render(); modal.hidden=true; toast('Restored "'+ver.name+'"'); });
    const del=document.createElement('button'); del.className='ghost'; del.textContent='Delete'; del.addEventListener('click',()=>{ if(!confirm('Delete "'+ver.name+'"?')) return; v.splice(i,1); saveVersions(v); openVersions(); });
    row.append(nm,meta,sp,view,rs,del); mlist.appendChild(row); });
  modal.hidden=false; }

function toMarkdown(st){
  const lines=['# Who Loses? Section 6 storyboard','',`Starting layout: ${st.preset==='current'?'current draft':'proposal'}; exported ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`,'',`Main story: ${st.story||''}`,''];
  st.columns.forEach(c=>{
    const ids=st.order[c.key]||[];
    lines.push(`## ${c.title}`);
    if(c.claim) lines.push(`Claim: ${c.claim}`);
    if(c.notes) lines.push(`Notes: ${c.notes.replace(/\n/g,' ')}`);
    lines.push(`Exhibits (${ids.length}):`);
    ids.forEach(id=>{ const e=exById[id]; if(!e) return; const moved=e.isNew?'(new)':(e.cur!==c.key?`(now ${shortName(e.cur)})`:''); lines.push(`- [${e.kind==='tab'?'Table':'Figure'}] ${e.id} ${moved} ${e.zh}`); });
    lines.push('');
  });
  return lines.join('\n');
}
const modal=document.getElementById('modal'), mtext=document.getElementById('mtext'), mtitle=document.getElementById('mtitle'), mhint=document.getElementById('mhint'), mactions=document.getElementById('mactions'), mlist=document.getElementById('mlist');
function openExport(){ const st=readonly?viewState:state; mtitle.textContent='Export'; mlist.hidden=true; mtext.hidden=false; mhint.textContent='Markdown for people; the last line is JSON that restores this board through Import.'; mtext.value=toMarkdown(st)+'\n<!-- state -->\n'+JSON.stringify(st); mactions.innerHTML=''; modal.hidden=false; mtext.focus(); mtext.select(); }
function openImport(){ mtitle.textContent='Import'; mlist.hidden=true; mtext.hidden=false; mhint.textContent='Paste the JSON line from an export.'; mtext.value=''; mactions.innerHTML='';
  const b=document.createElement('button'); b.className='primary'; b.textContent='Restore'; b.addEventListener('click',()=>{ try{ const txt=mtext.value; const j=txt.slice(txt.indexOf('{')); const st=JSON.parse(j); if(!st.columns||!st.order) throw 0; if(st.story==null) st.story=STORY_DEFAULT; state=st; readonly=false; save(); render(); modal.hidden=true; toast('Restored'); }catch(e){ toast('That is not valid JSON'); } });
  mactions.appendChild(b); modal.hidden=false; mtext.focus(); }
document.getElementById('export').addEventListener('click',openExport);
document.getElementById('import').addEventListener('click',openImport);
document.getElementById('save-version').addEventListener('click',saveVersion);
document.getElementById('versions').addEventListener('click',openVersions);
document.getElementById('mclose').addEventListener('click',()=>modal.hidden=true);
modal.addEventListener('click',ev=>{ if(ev.target===modal) modal.hidden=true; });
document.getElementById('copy').addEventListener('click',async()=>{ const txt=mtext.hidden?toMarkdown(readonly?viewState:state):mtext.value; try{ await navigator.clipboard.writeText(txt); toast('Copied'); }catch(e){ mtext.select(); toast('Press Ctrl/Cmd+C to copy'); } });
document.getElementById('add-col').addEventListener('click',addCol);
document.getElementById('p-current').addEventListener('click',()=>switchPreset('current'));
document.getElementById('p-proposal').addEventListener('click',()=>switchPreset('proposal'));
document.getElementById('view-current').addEventListener('click',()=>{ viewState=fromPreset('current',state.story); readonly=true; document.querySelector('.banner span').textContent='Viewing the current draft, read-only. Your board is untouched.'; render(); });
document.getElementById('back').addEventListener('click',()=>{ readonly=false; viewState=null; render(); });
document.getElementById('reset-story').addEventListener('click',()=>{ if(readonly) return; if(!confirm('Replace the story text with the six-point version?')) return; state.story=STORY_DEFAULT; save(); render(); toast('Story reset'); });
function switchPreset(name){ if(readonly){ readonly=false; viewState=null; } const label=name==='current'?'current draft':'proposal'; if(!confirm('Rearrange the board as the '+label+'? Unsaved changes on the board are lost (saved versions stay).')) return; state=fromPreset(name,state.story); save(); render(); }

const lb=document.getElementById('lightbox'), lbimg=document.getElementById('lbimg'), lbcap=document.getElementById('lbcap');
function openLightbox(src,cap){ lbimg.src=src; lbimg.alt=cap; lbcap.textContent=cap; lb.hidden=false; }
lb.addEventListener('click',()=>{ lb.hidden=true; lbimg.src=''; });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ lb.hidden=true; modal.hidden=true; } });
let toastTimer=null; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }

state=load()||fromPreset('proposal');
render();
})();
</script>
