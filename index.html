<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Loses Storyboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#1B1F27; --muted:#5F6875; --line:#D5DAE1;
  --accent:#0F6E6E; --accent-ink:#FFFFFF; --accent-soft:#D9EDEC;
  --tab:#4A5D7A; --tab-soft:#E4E9F1; --fig:#A56A12; --fig-soft:#F6EAD3;
  --moved:#8A3B2E; --moved-soft:#F5E2DD; --app:#E6E8EC; --shadow:0 1px 2px rgba(20,24,32,.08),0 6px 18px rgba(20,24,32,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171C; --surface:#1E2229; --surface-2:#252A32; --ink:#E7E9ED; --muted:#9AA3B0; --line:#343A44;
    --accent:#3FB4B0; --accent-ink:#0F1A1A; --accent-soft:#1E3A3A;
    --tab:#9DB2D1; --tab-soft:#283243; --fig:#E0A94C; --fig-soft:#3A2E17;
    --moved:#E58B77; --moved-soft:#3E2620; --app:#1A1D23; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171C; --surface:#1E2229; --surface-2:#252A32; --ink:#E7E9ED; --muted:#9AA3B0; --line:#343A44;
  --accent:#3FB4B0; --accent-ink:#0F1A1A; --accent-soft:#1E3A3A;
  --tab:#9DB2D1; --tab-soft:#283243; --fig:#E0A94C; --fig-soft:#3A2E17;
  --moved:#E58B77; --moved-soft:#3E2620; --app:#1A1D23; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;line-height:1.2}
button:hover{background:var(--surface-2)}
button:focus-visible,[contenteditable]:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.05)}
button.ghost{border-color:transparent;padding:4px 6px;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
textarea{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;resize:vertical}

.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.top h1{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;font-size:18px;margin:0;letter-spacing:.01em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.spacer{flex:1}
.legend{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.chip{display:inline-block;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;line-height:1.3}
.chip.tab{background:var(--tab-soft);color:var(--tab)}
.chip.fig{background:var(--fig-soft);color:var(--fig)}
.chip.moved{background:var(--moved-soft);color:var(--moved);text-transform:none;letter-spacing:0}
.chip.new{background:var(--accent-soft);color:var(--accent);text-transform:none;letter-spacing:0}

.board{flex:1;display:flex;gap:12px;padding:14px 16px 18px;overflow-x:auto;overflow-y:hidden;align-items:stretch}
.col{flex:0 0 300px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:0;max-height:100%}
.col.appendix{background:var(--app)}
.col.dragover{outline:2px solid var(--accent);outline-offset:-2px}
.colhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.colhead .row{display:flex;align-items:center;gap:6px}
.colkey{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.count{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:15.5px;line-height:1.25;padding:2px 4px;margin:0 -4px;border-radius:4px;min-height:1.2em}
.claim{font-size:12.5px;color:var(--muted);line-height:1.4;padding:2px 4px;margin:0 -4px;border-radius:4px;min-height:1.2em}
[contenteditable]:hover{background:var(--surface-2)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.colhead .tools{display:flex;gap:2px;margin-left:auto}
.notes{display:none;padding:0 12px 8px}
.col.shownotes .notes{display:block}
.notes textarea{min-height:56px;font-size:12.5px}
.cards{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.cards:empty::after{content:"Drop here";color:var(--muted);font-size:12px;text-align:center;padding:18px 0;border:1px dashed var(--line);border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 9px 8px;box-shadow:var(--shadow);cursor:grab;display:flex;flex-direction:column;gap:6px;position:relative}
.col.appendix .card{box-shadow:none}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .label{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:500;word-break:break-all}
.card .zh{font-size:12.5px;line-height:1.4}
.card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top left;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:zoom-in;display:block}
.card .thumb.tab{object-fit:contain;object-position:top left;padding:3px}
.card .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.card .foot select{font-size:11.5px;padding:2px 4px;margin-left:auto;max-width:150px}
.card .placeholder{aspect-ratio:16/9;border:1px dashed var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.drop-indicator{height:0;border-top:2px solid var(--accent);margin:-5px 0}

.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal[hidden]{display:none}
.dialog{background:var(--surface);color:var(--ink);border-radius:12px;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dialog header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dialog header h2{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:16px;margin:0;font-weight:600}
.dialog .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dialog textarea{min-height:320px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
.lightbox{position:fixed;inset:0;background:rgba(10,12,16,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px;cursor:zoom-out;overflow:auto}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.lightbox .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:13px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:700px){.col{flex-basis:260px}.top h1{font-size:16px}}
</style>

</head>
<body>
<div class="top">
  <div>
    <h1>Who Loses? Storyboard</h1>
    <div class="sub">How the Section 6 exhibits should be arranged. Drag cards between sections, click a title or claim to edit it, export when done.</div>
  </div>
  <div class="seg" role="group" aria-label="Layout">
    <button id="p-current" title="Every exhibit where it sits in the current draft (commit bcea9b2)">Current draft</button>
    <button id="p-proposal" title="The arrangement proposed on Sep 30">Proposal</button>
  </div>
  <button id="add-col">+ Add section</button>
  <div class="spacer"></div>
  <div class="legend"><span class="chip tab">Table</span><span class="chip fig">Figure</span><span class="chip moved">now 6.1</span><span>= sits elsewhere in the current draft</span></div>
  <button id="import">Import</button>
  <button id="export" class="primary">Export Markdown</button>
</div>

<div class="board" id="board"></div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-labelledby="mtitle">
    <header><h2 id="mtitle">Export</h2><div class="spacer"></div><button id="copy">Copy</button><button id="mclose" class="ghost">Close</button></header>
    <div class="body">
      <div id="mhint" class="sub"></div>
      <textarea id="mtext" spellcheck="false"></textarea>
      <div id="mactions" style="display:flex;gap:8px;justify-content:flex-end"></div>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lbimg" alt=""><div class="cap" id="lbcap"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="thumbs.js"></script>

<script>

let state=null;
function fromPreset(name){
  const p=PRESETS[name];
  const order={}; p.columns.forEach(c=>order[c.key]=[]);
  EX.forEach(e=>{ let k=p.assign(e); if(!order[k]) k=p.columns[p.columns.length-1].key; order[k].push(e.id); });
  return {preset:name,columns:p.columns.map(c=>({key:c.key,title:c.title,claim:c.claim,notes:''})),order};
}
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(STORE); if(s){ const st=JSON.parse(s); if(st&&st.columns&&st.order) return st; } }catch(e){} return null; }
function keyLabel(k){ return k==='A'?'appendix':(k==='X'?'parking':(k==='N'?'to do':'§'+k)); }
function shortName(k){ return k==='A'?'Appendix':(k==='X'?'Parking':(k==='N'?'To do':k)); }

const board=document.getElementById('board');
function render(){
  board.innerHTML='';
  document.getElementById('p-current').classList.toggle('on',state.preset==='current');
  document.getElementById('p-proposal').classList.toggle('on',state.preset==='proposal');
  state.columns.forEach((c,ci)=>{
    const col=document.createElement('section'); col.className='col'+(c.key==='A'?' appendix':'')+(c.notes?' shownotes':''); col.dataset.key=c.key;
    const head=document.createElement('div'); head.className='colhead';
    const row1=document.createElement('div'); row1.className='row';
    const key=document.createElement('span'); key.className='colkey'; key.textContent=keyLabel(c.key);
    const n=(state.order[c.key]||[]).length;
    const count=document.createElement('span'); count.className='count'; count.textContent=n+(n===1?' exhibit':' exhibits');
    const tools=document.createElement('span'); tools.className='tools';
    const mk=(t,title,fn)=>{const b=document.createElement('button');b.className='ghost';b.textContent=t;b.title=title;b.addEventListener('click',fn);return b;};
    tools.appendChild(mk('‹','Move section left',()=>moveCol(ci,-1)));
    tools.appendChild(mk('›','Move section right',()=>moveCol(ci,1)));
    tools.appendChild(mk('✎','Notes for this section',()=>{col.classList.toggle('shownotes');}));
    tools.appendChild(mk('✕','Remove this section (its exhibits go to Parking)',()=>delCol(ci)));
    row1.append(key,count,tools);
    const title=document.createElement('div'); title.className='title'; title.contentEditable='true'; title.dataset.ph='Section title'; title.textContent=c.title;
    title.addEventListener('blur',()=>{c.title=title.textContent.trim();save();});
    const claim=document.createElement('div'); claim.className='claim'; claim.contentEditable='true'; claim.dataset.ph='One-sentence claim for this section'; claim.textContent=c.claim;
    claim.addEventListener('blur',()=>{c.claim=claim.textContent.trim();save();});
    head.append(row1,title,claim);
    const notes=document.createElement('div'); notes.className='notes';
    const ta=document.createElement('textarea'); ta.placeholder='Notes: how to write it, what stays, what is open'; ta.value=c.notes||'';
    ta.addEventListener('input',()=>{c.notes=ta.value;save();});
    notes.appendChild(ta);
    const cards=document.createElement('div'); cards.className='cards'; cards.dataset.key=c.key;
    (state.order[c.key]||[]).forEach(id=>{ const e=exById[id]; if(e) cards.appendChild(renderCard(e,c.key)); });
    wireDrop(cards,col);
    col.append(head,notes,cards);
    board.appendChild(col);
  });
}
function renderCard(e,colKey){
  const d=document.createElement('article'); d.className='card'; d.draggable=true; d.dataset.id=e.id;
  const meta=document.createElement('div'); meta.className='meta';
  const chip=document.createElement('span'); chip.className='chip '+e.kind; chip.textContent=e.kind==='tab'?'Table':'Figure';
  const lab=document.createElement('span'); lab.className='label'; lab.textContent=e.id;
  meta.append(chip,lab);
  if(e.isNew){ const nn=document.createElement('span'); nn.className='chip new'; nn.textContent='new'; meta.appendChild(nn); }
  else if(e.cur!==colKey){ const m=document.createElement('span'); m.className='chip moved'; m.textContent='now '+shortName(e.cur); meta.appendChild(m); }
  const zh=document.createElement('div'); zh.className='zh'; zh.textContent=e.zh;
  d.append(meta,zh);
  const t=e.kind==='fig'?(e.img&&THUMBS[e.img]):TABS[e.id];
  if(t){ const img=document.createElement('img'); img.className='thumb'+(e.kind==='tab'?' tab':''); img.src=t.s; img.alt=e.id; img.loading='lazy';
    img.addEventListener('click',ev=>{ev.stopPropagation();openLightbox(t.l,e.id);}); d.appendChild(img); }
  else { const ph=document.createElement('div'); ph.className='placeholder'; ph.textContent=e.isNew?'not drawn yet':'no preview'; d.appendChild(ph); }
  const foot=document.createElement('div'); foot.className='foot';
  const sel=document.createElement('select'); sel.title='Move to…';
  const o0=document.createElement('option'); o0.textContent='Move to…'; o0.value=''; sel.appendChild(o0);
  state.columns.forEach(c=>{ if(c.key!==colKey){ const o=document.createElement('option'); o.value=c.key; o.textContent=c.title.slice(0,30); sel.appendChild(o);} });
  sel.addEventListener('change',()=>{ if(sel.value){ moveCard(e.id,sel.value,null); } });
  foot.appendChild(sel);
  d.appendChild(foot);
  d.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/plain',e.id); ev.dataTransfer.effectAllowed='move'; d.classList.add('dragging'); });
  d.addEventListener('dragend',()=>{ d.classList.remove('dragging'); clearIndicators(); });
  return d;
}
function clearIndicators(){ document.querySelectorAll('.drop-indicator').forEach(n=>n.remove()); document.querySelectorAll('.col.dragover').forEach(n=>n.classList.remove('dragover')); }
function wireDrop(cards,col){
  cards.addEventListener('dragover',ev=>{ ev.preventDefault(); ev.dataTransfer.dropEffect='move';
    clearIndicators(); col.classList.add('dragover');
    const after=cardAfterPointer(cards,ev.clientY); const ind=document.createElement('div'); ind.className='drop-indicator';
    if(after) cards.insertBefore(ind,after); else cards.appendChild(ind); });
  cards.addEventListener('dragleave',ev=>{ if(!col.contains(ev.relatedTarget)) clearIndicators(); });
  cards.addEventListener('drop',ev=>{ ev.preventDefault(); const id=ev.dataTransfer.getData('text/plain'); const after=cardAfterPointer(cards,ev.clientY); clearIndicators();
    moveCard(id,cards.dataset.key,after?after.dataset.id:null); });
}
function cardAfterPointer(cards,y){
  const els=[...cards.querySelectorAll('.card:not(.dragging)')];
  for(const el of els){ const r=el.getBoundingClientRect(); if(y<r.top+r.height/2) return el; }
  return null;
}
function moveCard(id,toKey,beforeId){
  for(const k in state.order){ const i=state.order[k].indexOf(id); if(i>=0) state.order[k].splice(i,1); }
  const arr=state.order[toKey]||(state.order[toKey]=[]);
  const j=beforeId?arr.indexOf(beforeId):-1;
  if(j>=0) arr.splice(j,0,id); else arr.push(id);
  save(); render();
}
function moveCol(i,dir){ const j=i+dir; if(j<0||j>=state.columns.length) return; const t=state.columns[i]; state.columns[i]=state.columns[j]; state.columns[j]=t; save(); render(); }
function delCol(i){ const c=state.columns[i]; if(state.columns.length<=2) return; if(!confirm('Remove "'+c.title+'"? Its exhibits move to Parking.')) return;
  let park=state.columns.find(x=>x.key==='X'); if(!park){ park={key:'X',title:'Parking',claim:'',notes:''}; state.columns.push(park); state.order.X=[]; }
  state.order.X=(state.order.X||[]).concat(state.order[c.key]||[]); delete state.order[c.key]; state.columns.splice(i,1); save(); render(); }
function addCol(){ let n=1; while(state.columns.some(c=>c.key==='new'+n)) n++; const key='new'+n; state.columns.splice(Math.max(1,state.columns.length-2),0,{key,title:'New section',claim:'',notes:''}); state.order[key]=[]; save(); render(); }

function toMarkdown(){
  const lines=['# Who Loses? Section 6 storyboard','',`Starting layout: ${state.preset==='current'?'current draft':'proposal'}; exported ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`,''];
  state.columns.forEach(c=>{
    const ids=state.order[c.key]||[];
    lines.push(`## ${c.title}`);
    if(c.claim) lines.push(`Claim: ${c.claim}`);
    if(c.notes) lines.push(`Notes: ${c.notes.replace(/\n/g,' ')}`);
    lines.push(`Exhibits (${ids.length}):`);
    ids.forEach(id=>{ const e=exById[id]; if(!e) return; const moved=e.isNew?'(new)':(e.cur!==c.key?`(now ${shortName(e.cur)})`:''); lines.push(`- [${e.kind==='tab'?'Table':'Figure'}] ${e.id} ${moved} ${e.zh}`); });
    lines.push('');
  });
  return lines.join('\n');
}
const modal=document.getElementById('modal'), mtext=document.getElementById('mtext'), mtitle=document.getElementById('mtitle'), mhint=document.getElementById('mhint'), mactions=document.getElementById('mactions');
function openExport(){ mtitle.textContent='Export'; mhint.textContent='Markdown for people; the last line is JSON that restores this board through Import.'; mtext.value=toMarkdown()+'\n<!-- state -->\n'+JSON.stringify(state); mactions.innerHTML=''; modal.hidden=false; mtext.focus(); mtext.select(); }
function openImport(){ mtitle.textContent='Import'; mhint.textContent='Paste the JSON line from an export.'; mtext.value=''; mactions.innerHTML='';
  const b=document.createElement('button'); b.className='primary'; b.textContent='Restore'; b.addEventListener('click',()=>{ try{ const txt=mtext.value; const j=txt.slice(txt.indexOf('{')); const st=JSON.parse(j); if(!st.columns||!st.order) throw 0; state=st; save(); render(); modal.hidden=true; toast('Restored'); }catch(e){ toast('That is not valid JSON'); } });
  mactions.appendChild(b); modal.hidden=false; mtext.focus(); }
document.getElementById('export').addEventListener('click',openExport);
document.getElementById('import').addEventListener('click',openImport);
document.getElementById('mclose').addEventListener('click',()=>modal.hidden=true);
modal.addEventListener('click',ev=>{ if(ev.target===modal) modal.hidden=true; });
document.getElementById('copy').addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(mtext.value); toast('Copied'); }catch(e){ mtext.select(); toast('Press Ctrl/Cmd+C to copy'); } });
document.getElementById('add-col').addEventListener('click',addCol);
document.getElementById('p-current').addEventListener('click',()=>switchPreset('current'));
document.getElementById('p-proposal').addEventListener('click',()=>switchPreset('proposal'));
function switchPreset(name){ const label=name==='current'?'current draft':'proposal'; if(state.preset===name && !confirm('Rearrange as the '+label+' again and discard the changes on this board?')) return; if(state.preset!==name && !confirm('Switching layouts discards the changes on this board. Export first?')) return; state=fromPreset(name); save(); render(); }

const lb=document.getElementById('lightbox'), lbimg=document.getElementById('lbimg'), lbcap=document.getElementById('lbcap');
function openLightbox(src,cap){ lbimg.src=src; lbimg.alt=cap; lbcap.textContent=cap; lb.hidden=false; }
lb.addEventListener('click',()=>{ lb.hidden=true; lbimg.src=''; });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ lb.hidden=true; modal.hidden=true; } });
let toastTimer=null; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }

state=load()||fromPreset('proposal');
render();
})();
</script>
